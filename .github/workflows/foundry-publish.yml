name: Publish to Foundry

# Lists a GitHub release on foundryvtt.com through the Package Release API, so Foundry offers it as an update.
# release.yml calls this after every release; run it by hand from the Actions tab to send an existing release.
# Needs the package's release token (fvttp_...) as the repository secret FOUNDRY_RELEASE_TOKEN.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to send, e.g. 1.3.1
        required: true
        type: string
      dry_run:
        description: Dry run (Foundry checks the request but saves nothing)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send the release to Foundry
        env:
          TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The FOUNDRY_RELEASE_TOKEN secret is not set"
            exit 1
          fi

          # The manifest attached to the release, as release.yml stamped it.
          gh release download "$TAG" --repo "$REPO" --pattern module.json

          # Foundry wants the manifest of this exact release, not the "latest" one players install from.
          base="https://github.com/$REPO/releases"
          jq -n --slurpfile m module.json --arg base "$base" --arg tag "$TAG" --argjson dry "$DRY_RUN" '
            $m[0] as $mod | {
              id: $mod.id,
              "dry-run": $dry,
              release: {
                version: $mod.version,
                manifest: "\($base)/download/\($tag)/module.json",
                notes: "\($base)/tag/\($tag)",
                compatibility: {
                  minimum: ($mod.compatibility.minimum // ""),
                  verified: ($mod.compatibility.verified // ""),
                  maximum: ($mod.compatibility.maximum // "")
                }
              }
            }' > payload.json
          cat payload.json

          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" -H "Authorization: $TOKEN" \
            --data @payload.json https://foundryvtt.com/_api/packages/release_version/)
          echo "HTTP $code"
          cat response.json
          echo
          [ "$code" = "200" ] && [ "$(jq -r .status response.json)" = "success" ]
